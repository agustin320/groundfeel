name: pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Estilo y errores (ruff)
        run: pip install ruff && ruff check .
      - name: Sintaxis de todos los scripts
        run: python -m compileall -q .
      - name: Pruebas del motor de efectos (sin simulador ni hardware)
        run: python pruebas.py
