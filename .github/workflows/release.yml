name: release

# Al subir un tag vX.Y.Z: pruebas, build, firma con SignPath (cuando esté configurada), instalador Inno Setup y
# publicación en Releases (de donde se actualiza la app instalada).
#
# Firma: con el secret SIGNPATH_API_TOKEN y las variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG y
# SIGNPATH_SIGNING_POLICY_SLUG cargadas, se firman el programa y el instalador (dos pedidos, cada uno con aprobación
# manual en SignPath). Sin eso, se publica sin firmar.
#
# Seguridad: acciones fijadas por SHA, dependencias con versión exacta, el token no queda guardado en el checkout y
# el nombre del tag entra a los scripts por variable de entorno (nunca interpolado en el código).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: write   # sólo para crear el release
      actions: read
    env:
      FIRMAR: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - name: El tag coincide con version.py
        id: version
        shell: pwsh
        run: |
          $v = python -c "from version import __version__; print(__version__)"
          if ("v$v" -ne $env:TAG) { throw "el tag $($env:TAG) no coincide con version.py ($v)" }
          "numero=$v" >> $env:GITHUB_OUTPUT
      - name: Dependencias (versiones exactas)
        run: |
          pip install -r requirements.txt pyinstaller==6.22.3 ruff==0.17.2
          choco install innosetup --version=6.7.1 -y --no-progress
      - name: Revisión y pruebas
        run: |
          ruff check .
          python pruebas.py
      - name: Build del programa
        run: pyinstaller --noconfirm VibracionURSA.spec

      # ---- firma del programa (antes de meterlo en el instalador)
      - name: Subir el programa sin firmar
        id: programa
        if: env.FIRMAR == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: programa-sin-firmar
          path: dist/VibracionURSA/VibracionURSA.exe
      - name: Firmar el programa (SignPath, espera la aprobación)
        if: env.FIRMAR == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627  # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: programa
          github-artifact-id: ${{ steps.programa.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: firmado-programa
      - name: Usar el programa firmado
        if: env.FIRMAR == 'true'
        shell: pwsh
        run: Copy-Item firmado-programa/VibracionURSA.exe dist/VibracionURSA/VibracionURSA.exe -Force

      - name: Instalador (Inno Setup)
        shell: pwsh
        env:
          NUMERO: ${{ steps.version.outputs.numero }}
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DVersion=$($env:NUMERO)" instalador.iss
          if ($LASTEXITCODE) { throw "ISCC falló" }

      # ---- firma del instalador
      - name: Subir el instalador sin firmar
        id: instalador
        if: env.FIRMAR == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: instalador-sin-firmar
          path: dist/VibracionURSA-Setup.exe
      - name: Firmar el instalador (SignPath, espera la aprobación)
        if: env.FIRMAR == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627  # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: instalador
          github-artifact-id: ${{ steps.instalador.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: firmado-instalador
      - name: Usar el instalador firmado y verificar las firmas
        if: env.FIRMAR == 'true'
        shell: pwsh
        run: |
          Copy-Item firmado-instalador/VibracionURSA-Setup.exe dist/VibracionURSA-Setup.exe -Force
          foreach ($f in 'dist/VibracionURSA-Setup.exe', 'dist/VibracionURSA/VibracionURSA.exe') {
            $s = Get-AuthenticodeSignature $f
            if ($s.Status -ne 'Valid') { throw "$f no quedó firmado: $($s.Status)" }
            "$f firmado por $($s.SignerCertificate.Subject)"
          }

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          # Mismo instalador con dos nombres: -Setup (instalaciones nuevas) y -Update (lo que baja el actualizador),
          # así las descargas de GitHub separan instalaciones de actualizaciones sin telemetría.
          Copy-Item dist/VibracionURSA-Setup.exe dist/VibracionURSA-Update.exe
          $notas = "**Download / Descarga:** ``VibracionURSA-Setup.exe`` (``-Update.exe`` is used by the built-in updater)`n`nCode signing policy: https://github.com/$($env:REPO)#code-signing-policy"
          gh release create $env:TAG dist/VibracionURSA-Setup.exe dist/VibracionURSA-Update.exe -R $env:REPO --title "Groundfeel $($env:TAG)" --notes $notas --generate-notes
